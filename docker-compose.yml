version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: paintmywall_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: paintuser
      POSTGRES_PASSWORD: paintpass
      POSTGRES_DB: paintmywall
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paintuser -d paintmywall"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paintmywall_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://paintuser:paintpass@db:5432/paintmywall
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paintmywall_web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_SHOP_WHATSAPP_NUMBER=${SHOP_WHATSAPP_NUMBER:-+919876543210}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
